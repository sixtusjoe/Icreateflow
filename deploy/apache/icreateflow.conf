# ICREATEFLOW — Apache vhost for icreateflow.com
# Installed at /etc/httpd/conf.d/icreateflow.conf
# Coexists with /etc/httpd/conf.d/spideybot.conf — different ServerName, zero collision.
# This file overrides the Hostinger panel's auto-generated vhost (httpd.conf:463/505)
# because conf.d/*.conf is parsed before those main-file entries.
#
# Proxies:
#   /api/*  → FastAPI backend  @ 127.0.0.1:8100
#   /*      → Next.js frontend @ 127.0.0.1:3100

<VirtualHost *:80>
    ServerName icreateflow.com
    ServerAlias www.icreateflow.com
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName icreateflow.com
    ServerAlias www.icreateflow.com
    DocumentRoot /home/icreateflow/public_html

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/icreateflow.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/icreateflow.com/privkey.pem

    # Security headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    ServerSignature Off

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    RequestHeader set X-Forwarded-Proto "https"

    # Backend media (cacheable) — match BEFORE /api/
    <Location /api/files/>
        ProxyPass        http://127.0.0.1:8100/api/files/
        ProxyPassReverse http://127.0.0.1:8100/api/files/
        Header set Cache-Control "public, max-age=604800"
    </Location>

    # Backend API
    <Location /api/>
        ProxyPass        http://127.0.0.1:8100/api/
        ProxyPassReverse http://127.0.0.1:8100/api/
    </Location>

    # Next.js frontend (catch-all)
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    # Large uploads (videos/images) — 200 MB default
    LimitRequestBody 209715200

    # WebM→MP4 conversion can receive 300–600 MB (40 Mbps × up to 60s clip)
    <Location /api/audio-to-video/convert-to-mp4>
        LimitRequestBody 629145600
    </Location>

    ErrorLog  /var/log/httpd/icreateflow_error.log
    CustomLog /var/log/httpd/icreateflow_access.log combined
</VirtualHost>
