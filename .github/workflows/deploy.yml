name: Deploy to VPS

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      run_diagnostics:
        description: 'Also run Bug-2 diagnostic SQL'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          if [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "::error::VPS_SSH_KEY secret is empty or unset"
            exit 2
          fi
          if [ -z "${{ secrets.VPS_HOST }}" ]; then
            echo "::error::VPS_HOST secret is empty or unset"
            exit 2
          fi
          if [ -z "${{ secrets.VPS_USER }}" ]; then
            echo "::error::VPS_USER secret is empty or unset"
            exit 2
          fi
          # Strip CRLF that may sneak in from a Windows paste.
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Verify the key parses before we try to use it.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null 2>&1; then
            echo "::error::Private key in VPS_SSH_KEY is invalid (header/footer missing or whitespace mangled)"
            head -1 ~/.ssh/id_ed25519
            tail -1 ~/.ssh/id_ed25519
            wc -l ~/.ssh/id_ed25519
            exit 3
          fi
          # Try to capture host key. If keyscan fails (firewall, slow handshake,
          # whatever), don't fail the step — fall back to disabling strict host
          # key checking. We're already trusting the VPS_HOST secret value, so
          # the marginal protection from a recorded fingerprint isn't worth a
          # silent CI failure.
          if ssh-keyscan -T 8 -p 22 "${{ secrets.VPS_HOST }}" 2>/tmp/keyscan.err >> ~/.ssh/known_hosts; then
            echo "Host key recorded."
          else
            echo "::warning::ssh-keyscan failed — falling back to StrictHostKeyChecking=no"
            cat /tmp/keyscan.err || true
            cat > ~/.ssh/config <<CFG
          Host *
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ConnectTimeout 20
          CFG
            chmod 600 ~/.ssh/config
          fi
          # Smoke test the connection itself.
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'echo "SSH OK on $(hostname)"'

      - name: Rsync source to VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "install -d -o icreateflow -g icreateflow /srv/icreateflow/src"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.DS_Store' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='venv/' \
            --exclude='.venv/' \
            --exclude='backend/icreate.db*' \
            --exclude='backend/zagged.db*' \
            --exclude='backend/output/' \
            --exclude='backend/uploads/' \
            --exclude='backend/.env' \
            --exclude='frontend/.env.local' \
            --exclude='frontend/.env.production' \
            --rsync-path="sudo -u icreateflow rsync" \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/icreateflow/src/

      - name: Stage systemd + apache configs
        run: |
          scp deploy/systemd/icreateflow-backend.service \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/icreateflow-backend.service
          scp deploy/systemd/icreateflow-frontend.service \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/icreateflow-frontend.service
          scp deploy/apache/icreateflow.conf \
              ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/icreateflow.apache.conf

      - name: Run deploy.sh
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'bash /srv/icreateflow/src/deploy/deploy.sh'

      - name: Tail backend journal (last 100 lines)
        if: always()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            'journalctl -u icreateflow-backend -n 100 --no-pager' || true

      - name: Bug 2 diagnostic SQL
        if: ${{ inputs.run_diagnostics }}
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} bash <<'EOF'
          set -e
          DB_URL="$(grep -E '^DATABASE_URL=' /srv/icreateflow/src/backend/.env | cut -d= -f2- | tr -d '"')"
          # SQLAlchemy postgresql+asyncpg → psql. Strip the +asyncpg / +psycopg.
          PSQL_URL="${DB_URL//postgresql+asyncpg/postgresql}"
          PSQL_URL="${PSQL_URL//postgresql+psycopg/postgresql}"
          echo "=== user_settings for clip_diversification_enabled ==="
          psql "$PSQL_URL" -c "SELECT user_id, key, value FROM user_settings WHERE key = 'clip_diversification_enabled';"
          echo "=== site_config for clip_diversification_enabled ==="
          psql "$PSQL_URL" -c "SELECT key, value FROM site_config WHERE key = 'clip_diversification_enabled';"
          echo "=== artists with their owner ==="
          psql "$PSQL_URL" -c "SELECT id, name, user_id FROM artists ORDER BY id;"
          echo "=== last 5 diversifier errors ==="
          psql "$PSQL_URL" -c "SELECT created_at, source, message, context FROM error_logs WHERE source LIKE 'scheduler.diversify.%' ORDER BY created_at DESC LIMIT 5;"
          EOF
